<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Portal de Colombia - Explorador de Departamentos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Mini Portal Informativo de Colombia</h1>
        <nav>
            <a href="index.html" class="activo">1. Explorador de Departamentos</a>
            <a href="colombia.html">2. Colombia en Datos</a>
        </nav>
    </header>

    <main>
        <h2>Explorador de Departamentos de Colombia</h2>

        <div id="mensaje-carga" class="mensaje-carga">
            Cargando departamentos desde la API de Colombia...
        </div>

        <div id="mensaje-error" class="mensaje-error oculto"></div>

        <section id="seccion-regiones" class="seccion-extra oculto">
            <h3>Cantidad de Departamentos por Región (Extra)</h3>
            <div id="contenedor-regiones" class="grid-regiones"></div>
        </section>

        <section>
            <div id="contenedor-departamentos" class="grid-tarjetas"></div>
        </section>
    </main>

    <footer>
        <p>Datos obtenidos de <a href="https://api-colombia.com/" target="_blank">API Colombia</a></p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
